[project]
  name            = "timeclock_entry_processor"
  version         = "2.0.0"
  description     = "Add your description here"
  requires-python = ">=3.14"
  dependencies    = [
    "aeth-ext>=8.0.7",
    "aiologic>=0.16.0",
    "fpdf2>=2.8.7",
    "pandas[performance]>=3.0.2",
    "pydantic-settings>=2.14.2",
    "python-dateutil>=2.9.0",
    "rich>=15.0.0",
    "typer>=0.26.0",
    "tzdata>=2025.3",
    "uvloop>=0.22.1 ; sys_platform == 'linux'",
    "winloop>=0.6.0 ; sys_platform == 'win32'",
  ]

  [project.scripts]
    timeclock-entry-processor = "timeclock_entry_processor.__main__:app"

[dependency-groups]
  dev = [
    "aeth-devkit>=8.2.1",
    "pandas-stubs>=3.0.0",
    "poethepoet>=0.46.0",
    "pyright>=1.1.411",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.15",
    "tombi>=1.5",
    "types-python-dateutil>=2.9.0",
  ]                                  # setup-project added: "pyright>=1.1.411", "pytest>=8.0", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "ruff>=0.15", "tombi>=1.5"

[build-system]
  requires      = ["uv_build>=0.11.2,<0.12.0"]
  build-backend = "uv_build"

[tool.coverage.run]
  data_file   = ".cache/.coverage"
  source_pkgs = ["timeclock_entry_processor"]

[tool.coverage.report]
  show_missing = true

[tool.coverage.html]
  directory = ".cache/htmlcov"

[tool.coverage.xml]
  output = ".cache/coverage.xml"

[tool.coverage.lcov]
  output = ".cache/coverage.lcov"

[tool.docker]
  # Paths relative to /app that the entrypoint will chown to nonroot:nonroot.
  # Typically these are directories that will be bind-mounted as Docker volumes.
  chown_paths = [
    "persisted_data",
  ]
  # Paths relative to /app that the entrypoint will create (mkdir -p) and chown.
  # These are implicitly included in the chown step.
  mkdirs      = []

[tool.poe]
  include_script = [{ script = "aeth_devkit:tasks", executor = { type = "uv", frozen = true } }]

[tool.pyright]
  typeCheckingMode = "standard"

  verboseOutput          = true
  useLibraryCodeForTypes = true

  enableReachabilityAnalysis  = true
  analyzeUnannotatedFunctions = true
  deprecateTypingAliases      = true

  reportPropertyTypeMismatch          = true
  reportMissingTypeStubs              = false
  reportImportCycles                  = true
  reportUntypedFunctionDecorator      = true
  reportUntypedClassDecorator         = true
  reportUntypedNamedTuple             = true
  reportPrivateUsage                  = true
  # reportConstantRedefinition          = true
  reportDeprecated                    = true
  # reportMissingSuperCall              = true
  reportUninitializedInstanceVariable = true
  reportMissingParameterType          = true
  # reportMissingTypeArgument           = true
  reportUnnecessaryIsInstance         = true
  reportUnnecessaryCast               = true
  reportUnnecessaryComparison         = true
  reportUnnecessaryContains           = true
  reportInvalidStubStatement          = true
  reportUnnecessaryTypeIgnoreComment  = true
  reportMatchNotExhaustive            = true
  reportUnreachable                   = true
  reportImplicitOverride              = true
  reportMissingTypeArgument           = false

  executionEnvironments = [{ root = "src", extraPaths = ["src"] }]

[tool.pytest.ini_options]
  addopts      = ["--cov", "--cov-report=term-missing", "--strict-markers", "--strict-config", "-ra"]
  cache_dir    = ".cache/pytest"
  testpaths    = ["tests"]
  xfail_strict = true
  asyncio_mode = "auto"

[tool.ruff]
  cache-dir = ".cache/ruff"

  src = ["./src", "../*/src", "../*/python"]  # setup-project added: "../*/src", "../*/python"

  exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "dist",
    "node_modules",
    "venv",
  ]

  fix = true

  indent-width = 2
  line-length  = 135

  [tool.ruff.format]
    docstring-code-format = true

  [tool.ruff.lint]
    extend-select = [
      "A",
      "ANN001",
      "ASYNC",
      "B",
      "C4",
      "C90",
      "D",
      "DTZ",
      "FBT003",
      "LOG",
      "N",
      "NPY",
      "PD",
      "PERF",
      "PL",
      "PYI",
      "RUF",
      "T10",
      "TC",
      "TID",
      "UP",
    ]
    ignore        = [
      "A004",
      "PD008",
      "PD009",
      "PLC0415",
      "PLR0913",
      "PLW0603",
      "PIE790",
    ]

    [tool.ruff.lint.flake8-tidy-imports.banned-api]
      # Delivered by ruff exactly when violated, so the reasoning costs no context otherwise.
      "__future__.annotations".msg = "Python 3.14 evaluates all annotations lazily (PEP 649) with or without this import. What it adds is PEP 563 stringification, which breaks pydantic, dataclasses.fields() introspection, and typing.get_type_hints."

    [tool.ruff.lint.pydocstyle]
      convention = "google"

    [tool.ruff.lint.per-file-ignores]
      # No missing-docstring rules in tests: a test's name is its summary, and test docstrings
      # read to agents as statements of intent that were never reviewed. D2xx+ still apply to
      # docstrings a test does have.
      "tests/**" = ["D1"]

    [tool.ruff.lint.isort]
      combine-as-imports = true
      known-first-party  = ["timeclock_entry_processor"]

      [tool.ruff.lint.isort.import-heading]
        first-party      = "First party imports"
        future           = "Future imports"
        local-folder     = "Local folder imports"
        standard-library = "Standard library imports"
        third-party      = "Third party imports"

[tool.tombi]
  toml-version = "v1.1.0"

  [tool.tombi.files]
    exclude = [
      ".bzr",
      ".direnv",
      ".eggs",
      ".git",
      ".git-rewrite",
      ".hg",
      ".mypy_cache",
      ".nox",
      ".pants.d",
      ".pytype",
      ".ruff_cache",
      ".svn",
      ".tox",
      ".venv",
      "__pypackages__",
      "_build",
      "buck-out",
      "dist",
      "node_modules",
      "venv",
    ]

  [tool.tombi.format.rules]
    indent-sub-tables               = true
    indent-table-key-value-pairs    = true
    key-value-equals-sign-alignment = true
    trailing-comment-alignment      = true

[tool.uv]
  environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
  ]

  [tool.uv.sources]
    aeth-ext    = [
      { index = "SFTPyPI" },
      # Registry-only so both platforms lock the same published version. For quick local
      # aeth-ext dev/testing, swap in the editable install:
      # { index = "SFTPyPI", marker = "sys_platform == 'linux'" },
      # { path = "../aeth_ext", editable = true, marker = "sys_platform == 'win32'" },
    ]
    aeth-devkit = [
      { index = "SFTPyPI" },
      # , marker = "sys_platform == 'linux'"
      # { path = "../aeth-devkit", editable = true, marker = "sys_platform == 'win32'" },
    ]

  [[tool.uv.index]]
    name        = "SFTPyPI"
    url         = "https://pypi.sweetfiretobacco.com/jacob.ogden/internal/+simple"
    publish-url = "https://pypi.sweetfiretobacco.com/jacob.ogden/internal/"
    explicit    = true
