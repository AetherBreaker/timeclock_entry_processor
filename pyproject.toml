[project]
  name            = "timeclock_entry_processor"
  version         = "1.7.9"
  description     = "Add your description here"
  readme          = "README.md"
  requires-python = ">=3.14"
  dependencies    = [
    "aeth-ext>=2.0.2",
    "aiologic>=0.16.0",
    "fpdf2>=2.8.7",
    "pandas-stubs==3.*",
    "pandas[performance]>=3.0.2",
    "pydantic==2.*",
    "pydantic-settings==2.*",
    "python-dateutil==2.9.*",
    "rich==15.*",
    "typer>=0.26.0",
    "types-python-dateutil==2.9.*",
    "tzdata>=2025.3",
    "uvloop>=0.22.1 ; sys_platform == 'linux'",
    "winloop>=0.6.0 ; sys_platform == 'win32'",
  ]

[tool.poe.tasks.release]
  help    = "Bump version, commit, tag, build, and publish to GitHub and SFTPyPI. Usage: poe release [major|minor|patch]"
  envfile = ".env"
  cmd     = "bash scripts/release.sh ${bump_type}"

  [[tool.poe.tasks.release.args]]
    name       = "bump_type"
    positional = true
    help       = "Version component to bump: major, minor, or patch"

[tool.pyright]
  extends = "../pyproject.toml"

[tool.ruff]
  extend = "../pyproject.toml"

  src = ["./src"]

[tool.uv]
  environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
  ]

  [tool.uv.sources]
    aeth-ext = [
      { index = "SFTPyPI", marker = "sys_platform == 'linux'" },
      { path = "../aeth_ext", editable = true, marker = "sys_platform == 'win32'" },
    ]

  [[tool.uv.index]]
    name        = "SFTPyPI"
    url         = "https://pypi.sweetfiretobacco.com/jacob.ogden/internal/+simple"
    publish-url = "https://pypi.sweetfiretobacco.com/jacob.ogden/internal/"
